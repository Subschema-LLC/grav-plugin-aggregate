en:
  PLUGIN_AGGREGATE:
    INSTANCE_URL: "AGGREGATE instance URL"
    INSTANCE_URL_HELP: "Base URL of your own AGGREGATE installation, without a trailing slash. The tracker script and its /api/receive endpoint are derived from this URL."
    WEBSITE_TOKEN: "Website token"
    WEBSITE_TOKEN_HELP: "Public token of the website registered in AGGREGATE (Websites page in the AGGREGATE dashboard, or the app:create-website command). The tracker stays off until both the instance URL and a token are set."
    INSTALLATION_MODE: "Installation mode"
    INSTALLATION_MODE_HELP: "Tracker only loads the AGGREGATE tracker (aggregate.js) directly. Tag manager lite loads the hosted tag container instead and never loads aggregate.js here: the tracker then runs as a tag inside the container, configured in AGGREGATE under Collection → Tag manager lite."
    MODE_TRACKER: "Tracker only"
    MODE_TAGMANAGER: "Tag manager lite"
    CONSENT_BANNER: "Consent banner"
    CONSENT_BANNER_HELP: "One banner at most: this is a single choice, never more than one per page. The built-in consent manager lite and the standalone banner are hosted by your AGGREGATE instance and configured there. The banner script loads before the tracker or the tag container. Choose 'None' when you run your own consent manager or none at all."
    BANNER_NONE: "None / my own consent manager"
    BANNER_BUILTIN: "Built-in consent manager lite"
    BANNER_STANDALONE: "Standalone banner"
    SITE_ID: "Tag manager site ID"
    SITE_ID_HELP: "Read-only. Derived from the website token above (the first 24 characters of its SHA-256); it is never stored, and the script URLs derive it the same way. It appears in the hosted banner and container URLs. Compare it in AGGREGATE under Collection → Tag manager lite, or with: php bin/console app:tag-manager:sites"
    CONSENT_DEFAULT: "Consent default"
    CONSENT_DEFAULT_HELP: "Consent state the tracker assumes before the visitor makes a choice. Your consent manager can update it at any time through Aggregate.setConsent(). Tracker mode only: in tag manager mode, the tracker tag's own URL inside AGGREGATE carries its consent default."
    CONSENT_DENIED: "Denied until the visitor chooses"
    CONSENT_GRANTED: "Granted"
    CONSENT_NONE: "Send no default"
    STRICT_PROFILE: "Strict collection profile"
    STRICT_PROFILE_HELP: "Opt this site into strict collection: the tracker sends only the page path, event name and goal. No cookies, storage, referrer, screen size or query string is read. Tracker mode only."
    RESPECT_DNT: "Respect Do Not Track"
    RESPECT_DNT_HELP: "When a browser sends the DNT header, none of the AGGREGATE scripts are added to the page at all."
    EXCLUDE_ADMINS: "Exclude Grav Admin users"
    EXCLUDE_ADMINS_HELP: "Visitors logged in with an account that has Grav Admin access are not tracked."
    MINIFIED: "Minified scripts"
    MINIFIED_HELP: "Load the minified builds of the hosted scripts: aggregate.js, the tag container (lib.js) and the consent banners are requested with ?min=1."
