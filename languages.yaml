en:
  PLUGIN_AGGREGATE:
    INSTANCE_URL: "AGGREGATE instance URL"
    INSTANCE_URL_HELP: "Base URL of your own AGGREGATE installation, without a trailing slash. The tracker script and its /api/receive endpoint are derived from this URL."
    WEBSITE_TOKEN: "Website token"
    WEBSITE_TOKEN_HELP: "Public token of the website registered in AGGREGATE (Websites page in the AGGREGATE dashboard, or the app:create-website command). The tracker stays off until both the instance URL and a token are set."
    CONSENT_DEFAULT: "Consent default"
    CONSENT_DEFAULT_HELP: "Consent state the tracker assumes before the visitor makes a choice. Your consent manager can update it at any time through Aggregate.setConsent()."
    CONSENT_DENIED: "Denied until the visitor chooses"
    CONSENT_GRANTED: "Granted"
    CONSENT_NONE: "Send no default"
    STRICT_PROFILE: "Strict collection profile"
    STRICT_PROFILE_HELP: "Opt this site into strict collection: the tracker sends only the page path, event name and goal. No cookies, storage, referrer, screen size or query string is read."
    RESPECT_DNT: "Respect Do Not Track"
    RESPECT_DNT_HELP: "When a browser sends the DNT header, the tracker script is not added to the page at all."
    EXCLUDE_ADMINS: "Exclude Grav Admin users"
    EXCLUDE_ADMINS_HELP: "Visitors logged in with an account that has Grav Admin access are not tracked."
    MINIFIED: "Minified tracker"
    MINIFIED_HELP: "Load the minified tracker build (aggregate.js?min=1), roughly half the size under the strict profile."
